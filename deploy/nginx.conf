# Alternativa ao Caddy. O certificado fica por conta do certbot.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/lista-de-compras
#   sudo ln -s /etc/nginx/sites-available/lista-de-compras /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d list.zanelatto.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name list.zanelatto.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tempo real: sem buffer e sem timeout curto, senao a conexao cai a cada minuto.
    location /api/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }
}
