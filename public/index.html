<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lista de Compras</title>
    <meta name="description" content="Lista de compras compartilhada da família, em tempo real." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f7a4f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1412" media="(prefers-color-scheme: dark)" />

    <!-- Instalação como app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Compras" />

    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="app" class="app" aria-live="polite">
      <div class="boot">
        <div class="boot__spinner" aria-hidden="true"></div>
        <p>Carregando...</p>
      </div>
    </div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
